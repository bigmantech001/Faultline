name: faultline
version: "0.1.1"
description: "Local API flight recorder, OpenAPI contract drift verifier, and deterministic chaos replay studio for Hermes."
author: "bigmantech001"
license: MIT
requires_hermes: ">=0.22.5"
provides_tools:
  - faultline_proxy
  - faultline_traces
  - faultline_replay
  - faultline_contract
  - faultline_chaos
  - faultline_simulate
provides_hooks:
  - post_tool_call
  - on_session_start
provides_middleware:
  - tool_execution
config_schema:
  latency_spike_threshold_ms:
    type: int
    default: 400
    label: "Latency Spike Threshold (ms)"
    description: "Flag captured HTTP requests exceeding this duration as latency regressions."
  auto_redact_headers:
    type: bool
    default: true
    label: "Redact Sensitive Auth Headers"
    description: "Automatically mask Authorization, Cookie, and API-key headers before persisting traces."
  max_body_chars:
    type: int
    default: 16384
    label: "Max Stored Payload Size (chars)"
    description: "Maximum request/response body characters stored per trace in SQLite."
  allow_local_replay:
    type: bool
    default: false
    label: "Allow Replay Against Local Services"
    description: "Let faultline_replay re-send captured requests to loopback and private-network upstreams (your local service under test). Off by default: replay then reaches public hosts only. Link-local and cloud-metadata addresses are always refused."
